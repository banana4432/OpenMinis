name: Build Minis Study IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minis-study-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 330

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode and show environment
        shell: bash
        run: |
          set -euxo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          sw_vers
          df -h

      - name: Install native build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        shell: bash
        run: |
          set -euxo pipefail
          brew install ninja llvm lld libarchive pkg-config meson
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$(brew --prefix libarchive)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false

      - name: Verify build tools
        shell: bash
        run: |
          set -euxo pipefail
          meson --version
          ninja --version
          go version
          clang --version | head -1
          xcrun --sdk iphoneos metal --version || xcodebuild -downloadComponent MetalToolchain || true

      - name: Restore native dependency cache
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            deps/lame-build
            deps/frameworks
            deps/libs
            deps/include
            deps/resources
          key: minis-ios-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deps/build_*.sh', 'deps/prepare_*.sh', 'deps/ffmpeg-patch/**', 'deps/rclone-mobile/go.mod', 'deps/rclone-mobile/go.sum', '.gitmodules') }}

      - name: Build native dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x deps/*.sh
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh
          df -h

      - name: Validate cached native dependencies
        shell: bash
        run: |
          set -euxo pipefail
          test -f deps/lame-build/lib/libmp3lame.a
          test -d deps/frameworks/FFmpeg.framework
          test -d deps/frameworks/Rclone.xcframework
          test -f deps/libs/libish.a
          test -f deps/resources/alpine-rootfs.zip

      - name: Prepare provider customization
        shell: bash
        run: |
          set -euxo pipefail
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig

      - name: Verify study app identity
        shell: bash
        run: python3 scripts/verify_study_ios_identity.py

      - name: Build unsigned release app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build/xcodebuild.log

      - name: Verify and package unsigned IPA
        shell: bash
        run: |
          set -euxo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/Minis.app"
          test -d "$APP"

          MAIN_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist")
          test "$MAIN_ID" = "com.banana4432.minis.study"
          test "$DISPLAY_NAME" = "Minis 学习"

          while IFS= read -r extension; do
            EXT_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$extension/Info.plist")
            case "$EXT_ID" in
              com.banana4432.minis.study.*) ;;
              *) echo "Unexpected extension bundle ID: $EXT_ID"; exit 1 ;;
            esac
          done < <(find "$APP/PlugIns" -maxdepth 1 -type d -name '*.appex' 2>/dev/null || true)

          # Preserve each target's entitlement declaration in an ad-hoc signature.
          # Resigning tools inspect these signatures when generating the final
          # provisioning profile. Without them, App Group access is commonly
          # stripped and Minis crashes when its shared container resolves nil.
          find "$APP/Frameworks" -maxdepth 1 -type d -name '*.framework' -print0 2>/dev/null |
            while IFS= read -r -d '' framework; do
              codesign --force --sign - "$framework"
            done
          codesign --force --sign - \
            --entitlements src/ios/FileProvider/FileProvider.entitlements \
            "$APP/PlugIns/MinisFileProvider.appex"
          codesign --force --sign - \
            --entitlements src/ios/ShareExtension/ShareExtension.entitlements \
            "$APP/PlugIns/MinisShare.appex"
          codesign --force --sign - \
            --entitlements src/ios/AgentWidget/AgentWidget.entitlements \
            "$APP/PlugIns/AgentWidgetExtension.appex"
          codesign --force --sign - \
            --entitlements src/ios/Minis.entitlements \
            "$APP"
          codesign --verify --deep --strict "$APP"

          find "$APP" -name embedded.mobileprovision -delete
          rm -rf Payload Minis-Study-unsigned.ipa
          mkdir Payload
          ditto "$APP" "Payload/Minis.app"
          ditto -c -k --sequesterRsrc --keepParent Payload Minis-Study-unsigned.ipa
          shasum -a 256 Minis-Study-unsigned.ipa | tee Minis-Study-unsigned.ipa.sha256
          ls -lh Minis-Study-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Minis-Study-unsigned-IPA-${{ github.run_number }}
          path: |
            Minis-Study-unsigned.ipa
            Minis-Study-unsigned.ipa.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Minis-Study-build-log-${{ github.run_number }}
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14
